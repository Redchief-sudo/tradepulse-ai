[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "tradepulse-runtime"
version = "0.1.0"
description = "Standalone, production-oriented TradePulse trading runtime"
requires-python = ">=3.12"
authors = [{ name = "Damien Johnson Fisher" }]
dependencies = ["httpx>=0.27"]

[project.scripts]
tradepulse = "tradepulse.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "mypy>=1.11", "exchange_calendars>=4.5"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
include = ["tradepulse*"]

[tool.pytest.ini_options]
testpaths = ["python_tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = ["integration: touches real external services (e.g. a live Alpaca paper account); skipped by default"]

[tool.ruff]
target-version = "py312"
line-length = 120

# Strict typing covers only the listed modules; everything else is followed for
# types but not checked (follow_imports=silent), so untyped Alpaca-era modules
# never produce errors here. Per-module strict is spelled out flag by flag
# because `strict` is not allowed inside an override.
[tool.mypy]
python_version = "3.12"
files = ["tradepulse/broker", "python_tests/typing"]
follow_imports = "silent"
ignore_missing_imports = true
warn_redundant_casts = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["tradepulse.broker.port", "tradepulse.broker.simulated", "tradepulse.runtime_lease", "python_tests.typing.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
