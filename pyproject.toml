[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "tradepulse-runtime"
version = "0.1.0"
description = "Standalone, production-oriented TradePulse trading runtime"
requires-python = ">=3.12"
authors = [{ name = "Damien Johnson Fisher" }]
dependencies = ["httpx>=0.27"]

[project.scripts]
tradepulse = "tradepulse.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
include = ["tradepulse*"]

[tool.pytest.ini_options]
testpaths = ["python_tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = ["integration: touches real external services (e.g. a live Alpaca paper account); skipped by default"]

[tool.ruff]
target-version = "py312"
line-length = 120
